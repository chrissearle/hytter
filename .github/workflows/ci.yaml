name: Build

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-meta:
    runs-on: ubuntu-latest
    outputs:
      short_sha_tag: ${{ steps.short_sha.outputs.short_sha_tag }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - uses: actions/checkout@v7

      - id: short_sha
        name: Compute short-sha tag (matches metadata-action)
        run: echo "short_sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        name: Docker metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hytter-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

  backend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          working_directory: backend

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check
        working-directory: backend
        run: ./gradlew clean check

      - name: Upload reports if failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/**/build/reports/
            backend/**/build/test-results/

  backend-build-amd64:
    runs-on: ubuntu-latest
    needs: [backend-meta, backend-test]
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/hytter-backend
      SHORT_SHA_TAG: ${{ needs.backend-meta.outputs.short_sha_tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Generate build info resource
        run: |
          mkdir -p backend/src/main/resources
          echo "${SHORT_SHA_TAG}" > backend/src/main/resources/image-tag.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ env.SHORT_SHA_TAG }}-amd64
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=max,scope=backend-amd64

  backend-build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [backend-meta, backend-test]
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/hytter-backend
      SHORT_SHA_TAG: ${{ needs.backend-meta.outputs.short_sha_tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Generate build info resource
        run: |
          mkdir -p backend/src/main/resources
          echo "${SHORT_SHA_TAG}" > backend/src/main/resources/image-tag.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ env.SHORT_SHA_TAG }}-arm64
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64

  backend-manifest:
    runs-on: ubuntu-latest
    needs: [backend-meta, backend-build-amd64, backend-build-arm64]
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/hytter-backend
      SHORT_SHA_TAG: ${{ needs.backend-meta.outputs.short_sha_tag }}
      TAGS: ${{ needs.backend-meta.outputs.tags }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifests for all tags
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              -t "$tag" \
              "${IMAGE_BASE}:${SHORT_SHA_TAG}-amd64" \
              "${IMAGE_BASE}:${SHORT_SHA_TAG}-arm64"
          done <<< "${TAGS}"

      - name: Tag staging (alias latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:staging" \
            "${IMAGE_BASE}:latest"

      - name: Generate summary
        run: |
          echo "Short SHA Tag: ${SHORT_SHA_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image base: ${IMAGE_BASE}" >> "$GITHUB_STEP_SUMMARY"

  frontend-meta:
    runs-on: ubuntu-latest
    outputs:
      short_sha_tag: ${{ steps.short_sha.outputs.short_sha_tag }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - uses: actions/checkout@v7

      - id: short_sha
        name: Compute short-sha tag (matches metadata-action)
        run: echo "short_sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        name: Docker metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/hytter-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          working_directory: frontend

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Lint
        run: pnpm lint
        working-directory: frontend

      - name: Typecheck
        run: pnpm typecheck
        working-directory: frontend

      - name: Test
        run: pnpm test
        working-directory: frontend

  frontend-build-amd64:
    runs-on: ubuntu-latest
    needs: [frontend-meta, frontend-check]
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/hytter-frontend
      SHORT_SHA_TAG: ${{ needs.frontend-meta.outputs.short_sha_tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ env.SHORT_SHA_TAG }}-amd64
          cache-from: type=gha,scope=frontend-amd64
          cache-to: type=gha,mode=max,scope=frontend-amd64

  frontend-build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: [frontend-meta, frontend-check]
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/hytter-frontend
      SHORT_SHA_TAG: ${{ needs.frontend-meta.outputs.short_sha_tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_BASE }}:${{ env.SHORT_SHA_TAG }}-arm64
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,mode=max,scope=frontend-arm64

  frontend-manifest:
    runs-on: ubuntu-latest
    needs: [frontend-meta, frontend-build-amd64, frontend-build-arm64]
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/hytter-frontend
      SHORT_SHA_TAG: ${{ needs.frontend-meta.outputs.short_sha_tag }}
      TAGS: ${{ needs.frontend-meta.outputs.tags }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifests for all tags
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              -t "$tag" \
              "${IMAGE_BASE}:${SHORT_SHA_TAG}-amd64" \
              "${IMAGE_BASE}:${SHORT_SHA_TAG}-arm64"
          done <<< "${TAGS}"

      - name: Tag staging (alias latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:staging" \
            "${IMAGE_BASE}:latest"

      - name: Generate summary
        run: |
          echo "Short SHA Tag: ${SHORT_SHA_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image base: ${IMAGE_BASE}" >> "$GITHUB_STEP_SUMMARY"
